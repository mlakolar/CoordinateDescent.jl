name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
        include:
          - version: '1'
            os: macos-latest
            arch: aarch64
          - version: '1'
            os: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # ProximalSolvers is not registered yet: 0.1.0 is General PR #173068, and
      # 0.1.1, which has SqrtQuadraticFunction, is on its master. Julia 1.11 and
      # later take it from [sources] in Project.toml; Julia 1.10 ignores
      # [sources]. Remove this step and [sources] once 0.1.1 is registered.
      - name: Add ProximalSolvers from GitHub on Julia 1.10
        if: matrix.version == 'lts'
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.add(url="https://github.com/mlakolar/ProximalSolvers.jl", rev="master")
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  examples:
    # the examples environment loads this checkout through [sources], which
    # needs Julia 1.11 or later
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - run: julia --project=examples -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=examples examples/run_all.jl
